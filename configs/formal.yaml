# The experiments of the paper. They are run by formal.py:
#   python formal.py plan              what is planned, what is on disk, how long the rest takes
#   python formal.py run stage1        train what is missing (finished runs are skipped: start again at any time)
#   python formal.py test tests1       score the finished runs under test conditions (no training; what is on disk
#                                      is skipped)
#   python formal.py summary stage1    the table of what is on disk
#
# A run is one seed of one version on one dataset; it is saved as results/formal/<dataset>/<version>/run<seed>.json
# (see symbionet/runs.py). Its settings are configs/default.yaml, then configs/datasets.yaml, then `common`, the
# entry of its dataset under `datasets`, and its version. The value $patch stands for the patch side of the dataset,
# and $name for the entry of the dataset in the table `name` under `values`.

exp: formal
seeds: [0, 1, 2, 3, 4]

common:
  eval.every: 5              # the test pixels are scored every 5 epochs; the best and the last epoch are reported

datasets:
  houston2013: {data.patch: 11}
  muufl: {data.patch: 9}
  trento: {data.patch: 9}

# Values that depend on the dataset; a version writes $name.
values:
  # Fewer labels: with one half (one quarter) of the training pixels an epoch has fewer steps, so the epochs are
  # lengthened to keep the number of training steps of the full setting (Houston2013 and MUUFL: 5 steps per epoch
  # become 3 (2); Trento: 10 become 5 (3)), and the test pixels are scored about 100 times per run, as in stage1.
  half_epochs: {houston2013: 835, muufl: 835, trento: 1000}
  half_every: {houston2013: 8, muufl: 8, trento: 10}
  quarter_epochs: {houston2013: 1250, muufl: 1250, trento: 1670}
  quarter_every: {houston2013: 12, muufl: 12, trento: 17}
  # Patch sides of the parameter analysis, next to the default (11, 9, 9).
  patch_a: {houston2013: 7, muufl: 5, trento: 5}
  patch_b: {houston2013: 9, muufl: 7, trento: 7}
  patch_c: {houston2013: 13, muufl: 11, trento: 11}

# How a masked view is made (masked labeled copies and M2C use the same masks): complementary pixel masks, lost
# values replaced by the band means of the image. The pixel reconstruction loss of earlier versions is off.
_masking: &masking
  model.rec_weighting: none
  model.lam: 0
  model.mask_mode: complementary
  model.fill: mean

versions:
  # the method of the paper: masked labeled copies + M2C + the gate (the gated symmetric fusion block, GSFB)
  full: &full
    <<: *masking
    model.decoder: identity
    model.mask_labeled: true
    model.pre_gate: known
    model.pre_gate_p: 0.5
  # ---- ablation study
  base: {}                   # the network alone: clean labeled patches, no masked view, no gate
  m2c:                       # + M2C only
    <<: *masking
    model.decoder: identity
  copies: &copies            # + masked labeled copies only
    <<: *masking
    model.decoder: null
    model.mask_labeled: true
  copies_whole:              # the masked labeled copies lose a whole modality instead of pixels (modality dropout)
    <<: *masking
    model.decoder: null
    model.mask_labeled: true
    model.mask_block: $patch
  copies_m2c:                # masked labeled copies + M2C, no gate
    <<: *masking
    model.decoder: identity
    model.mask_labeled: true
  copies_gate:               # masked labeled copies + the gate, no M2C
    <<: *masking
    model.decoder: null
    model.mask_labeled: true
    model.pre_gate: known
    model.pre_gate_p: 0.5
  full_indep:                # the full method with independent masks in the two modalities
    <<: *masking
    model.decoder: identity
    model.mask_labeled: true
    model.pre_gate: known
    model.pre_gate_p: 0.5
    model.mask_mode: independent
  full_same:                 # the full method with the same positions masked in both modalities
    <<: *masking
    model.decoder: identity
    model.mask_labeled: true
    model.pre_gate: known
    model.pre_gate_p: 0.5
    model.mask_mode: same
  # ---- fewer labeled pixels: one half and one quarter of the training pixels of every class (each run draws its
  # own part; the pixels left out stay in the unlabeled pool; the test pixels are the same)
  full_half: {<<: *full, data.train_fraction: 0.5, training.epochs: $half_epochs, eval.every: $half_every}
  base_half: {data.train_fraction: 0.5, training.epochs: $half_epochs, eval.every: $half_every}
  copies_half: {<<: *copies, data.train_fraction: 0.5, training.epochs: $half_epochs, eval.every: $half_every}
  full_quarter: {<<: *full, data.train_fraction: 0.25, training.epochs: $quarter_epochs, eval.every: $quarter_every}
  base_quarter: {data.train_fraction: 0.25, training.epochs: $quarter_epochs, eval.every: $quarter_every}
  copies_quarter: {<<: *copies, data.train_fraction: 0.25, training.epochs: $quarter_epochs, eval.every: $quarter_every}
  # ---- parameter analysis: the full method with one setting changed
  full_gate1: {<<: *full, model.pre_gate_p: 1.0}             # the gate on every masked view in training
  full_depth1: {<<: *full, model.depth: 1}                   # fusion blocks: 1, 3 (default 2)
  full_depth3: {<<: *full, model.depth: 3}
  full_wide96: {<<: *full, model.d: 96, model.hidden: 192}   # token width 96 (default 64)
  full_rho25: {<<: *full, model.mask_ratio: 0.25}            # mask ratio (default 0.5)
  full_rho375: {<<: *full, model.mask_ratio: 0.375}
  full_alpha05: {<<: *full, training.masked_weight: 0.5}     # weight of the masked copies (default 1)
  full_alpha2: {<<: *full, training.masked_weight: 2.0}
  full_beta05: {<<: *full, model.beta: 0.5}                  # weight of L_feat (default 1)
  full_beta2: {<<: *full, model.beta: 2.0}
  full_pool128: {<<: *full, training.pool_batch: 128}        # pool patches per step (default 256)
  full_pool512: {<<: *full, training.pool_batch: 512}
  full_patch_a: {<<: *full, data.patch: $patch_a}            # patch side
  full_patch_b: {<<: *full, data.patch: $patch_b}
  full_patch_c: {<<: *full, data.patch: $patch_c}
  # ---- size of the unlabeled pool (Houston2013: 637799 pool pixels by default): a fixed random part of it
  full_pool18k: {<<: *full, data.pool_size: 18354}           # as many as the pool of MUUFL has
  full_pool70k: {<<: *full, data.pool_size: 70000}

stages:
  stage1:
    title: comparison tables and ablation study
    versions: [full, base, copies_m2c, copies_gate, copies, m2c, copies_whole, full_indep, full_same]
    datasets: [houston2013, muufl, trento]
  stage3:
    title: fewer labeled pixels (one half and one quarter of the training pixels)
    versions: [full_half, base_half, copies_half, full_quarter, base_quarter, copies_quarter]
    datasets: [houston2013, muufl, trento]
  stage4:
    title: parameter analysis (the full method with one setting changed, three seeds)
    seeds: [0, 1, 2]
    versions: [full_gate1, full_depth1, full_depth3, full_wide96, full_rho25, full_rho375, full_alpha05, full_alpha2,
               full_beta05, full_beta2, full_pool128, full_pool512, full_patch_a, full_patch_b, full_patch_c]
    datasets: [houston2013, muufl, trento]
  stage5:
    title: size of the unlabeled pool
    versions: [full_pool18k, full_pool70k]
    datasets: [houston2013]

# Test stages: finished runs are scored under test conditions, without training. A part scores the runs of its
# versions (weights of the best or of the last epoch) under the conditions of its suites (symbionet/conditions.py):
#   corruptions   the 46 conditions of the paper: noise, lost pixels, occluded blocks, lost bands, a missing modality
#   shift         the LiDAR raster shifted by 1, 2 and 3 pixels against the HSI (mean of the four directions)
#   interp        lost LiDAR pixels and blocks filled by nearest-neighbour interpolation instead of the band means
# The parts are done in the order given. zones: a zone map per dataset; every tested run is also scored inside and
# outside the zone on the clean test pixels (masks/README.md).
tests:
  tests1:
    title: robustness of the stage1 models
    of: stage1
    parts:
      - {name: corruptions, suites: [corruptions], versions: all, weights: best}
      - {name: extra, suites: [shift, interp], versions: [base, copies, copies_whole, copies_m2c, full], weights: best}
      - {name: last, suites: [corruptions], versions: [base, full], weights: last}
    zones:
      houston2013: masks/houston2013_cloud_shadow.npz
    # Rules for the new tests, written down on 2026-11-12 before their first run; B against A, both with the
    # weights of the best epoch. `formal.py summary tests1` applies them to what is on disk.
    #   shift    (drop of B) - (drop of A) at `level` pixels: holds (B is not more sensitive) if at most `same`
    #            on every dataset; fails if above `worse` on two or more datasets; otherwise no claim.
    #   interp   B with the band means against A with interpolated values, per kind of loss: holds if B is at
    #            least `better` above A on two or more datasets and nowhere more than `same` below; fails if A is
    #            at least `better` above B on two or more datasets; otherwise no claim.
    #   shadow   OA on the shadow pixels: a clear difference needs `better` points and two standard errors.
    rules:
      pair: [full, base]
      shift: {level: 1, same: 0.5, worse: 1.0}
      interp: {better: 1.0, same: 0.5}
      shadow: {better: 1.0}

  # The fewer-label models under the 46 conditions (Table "fewer labels": clean OA and mean OA under corruption).
  # Rule written down on 2026-11-12, before the run: "the gain in robustness holds with fewer labels" is claimed
  # only if the mean OA of full over the 46 conditions is at least 5 points above that of base on every dataset,
  # with one half and with one quarter of the labels. Whether the gap grows with fewer labels is reported as it is.
  tests2:
    title: robustness of the fewer-label models
    of: stage3
    parts:
      - {name: corruptions, suites: [corruptions], versions: all, weights: best}

# python formal.py timing: seconds per training epoch (from two short trainings of `epochs` epochs: the difference
# of their times over the difference of their epochs) and milliseconds per test patch, with nothing else running.
timing:
  versions: [base, full]
  datasets: [houston2013, muufl, trento]
  epochs: [10, 40]

# python formal.py maps: the predicted class of every pixel of every scene, for the figures of the paper
# (results/formal/maps/): the clean scene for every finished seed of these versions, and these conditions (their
# first draw) for the first seed.
maps:
  of: stage1
  versions: [base, full]
  conditions: [missing lidar 1, missing hsi 1, block hsi 0.3, block lidar 0.3, pixel both 0.5, noise lidar 10]

# Seconds for one model on all test pixels of a dataset (RTX 4060 laptop); used for the first time estimate of a
# test stage only.
seconds_per_test: {houston2013: 1.7, muufl: 3.4, trento: 2.2}

# Minutes per run on the RTX 4060 laptop at eval.every 5 (from the screening runs); used for the first time
# estimate only, the runs on disk replace it. Kinds: m2c = with the completion branch, copies = masked labeled
# copies without it, base = neither.
minutes:
  base: {houston2013: 3.4, muufl: 6.4, trento: 4.3}
  copies: {houston2013: 4.5, muufl: 7.5, trento: 5.4}
  m2c: {houston2013: 8.9, muufl: 9.0, trento: 10.4}
