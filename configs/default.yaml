# Default SymbioNet training configuration. Dataset overrides are in datasets.yaml.
data:
  root: dataset
  split: geo
  split_ratio: 0.01
  split_seed: 0
  split_file: null
  split_dir: splits
  hsi_norm: minmax
  lidar_norm: minmax
  pca: 0
  pca_scale: each
  patch: 11
  padding: zero
  augment: flip
  train_fraction: 1.0
  pool_test: false
  pool_size: 0
  pool_seed: 0
model:
  d: 64
  heads: 4
  hidden: 128
  depth: 2
  mask_mode: complementary
  mask_ratio: 0.5
  mask_split: dirichlet
  mask_block: 1
  beta: 1.0
  mask_labeled: true
  pre_gate: known
  pre_gate_p: 0.5
  spectral_probability: 0.5
  spectral_max: 0.3
training:
  epochs: 500
  batch_size: 32
  optimizer: adam
  lr: 0.001
  weight_decay: 0.001
  min_lr: 1.0e-06
  label_smoothing: 0.2
  class_weight: inv_sqrt
  pool_batch: 256
  masked_weight: 1.0
eval:
  every: 5
  chunk: 1024
  subset: 0
runs: 5
seed: 0
print_every: 50
