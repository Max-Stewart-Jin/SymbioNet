name: Source and split checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install 'torch>=2.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Install required packages
        run: python -m pip install -r requirements.txt
      - name: Validate archived source and fixed splits
        run: python tools/verify_release.py
      - name: Lightweight unit tests (CPU, no datasets)
        run: |
          python tests/test_conditions.py
          python tests/test_corrupt.py
          python tests/test_data.py
      - name: Validate experiment plan
        run: python formal.py plan > /dev/null
